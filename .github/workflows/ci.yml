name: CI

on:
  push:
    branches:
      - main
      - security
      - rust-improvements
      - "feature/**"
      - "fix/**"
      - "hotfix/**"
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --manifest-path rust/Cargo.toml --all-targets --all-features -- -D warnings

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        os: [ubuntu-latest]
        include:
          - python-version: "3.14"
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      # The suite needs the test runner, not the dev group's data tooling
      # (`datasets`/`pyarrow` publish no wheels for every interpreter in the
      # matrix); the training scripts install those themselves.
      - run: uv sync --no-group dev
      - run: uv pip install pytest pytest-cov
      - uses: dtolnay/rust-toolchain@stable
      - run: uv pip install -e rust
      - run: uv run pytest tests/ -q --tb=short --cov --cov-report=xml --cov-report=term-missing
        env:
          PYTHONPATH: rust
      - name: Run Rust accuracy test
        if: matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest'
        run: cargo test --manifest-path rust/Cargo.toml --test test_accury -- --nocapture
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: chardet/chardet
          fail_ci_if_error: false
